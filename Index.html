<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bookkeeper" />
  <meta name="theme-color" content="#c9a84c" />
  <link rel="manifest" href="manifest.json" />
  <title>Bookkeeper Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0f; --bg2: #12121e; --bg3: #1a1a28;
      --border: #2a2a3a; --border2: #1e1e2a;
      --gold: #c9a84c; --gold-dim: rgba(201,168,76,0.15);
      --text: #e8e4dc; --muted: #6b6b85;
      --green: #4ade80; --red: #f87171;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; position: relative; }
    #header { padding: calc(var(--safe-top) + 15px) 20px 0; background: var(--bg); border-bottom: 1px solid var(--border2); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .btn-new { background: var(--gold); color: #000; border: none; border-radius: 20px; padding: 8px 16px; font-weight: bold; font-size: 14px; }
    .nav { display: flex; gap: 20px; }
    .nav-btn { background: none; border: none; color: var(--muted); padding-bottom: 8px; font-size: 14px; border-bottom: 2px solid transparent; }
    .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    #content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: calc(var(--safe-bot) + 30px); }
    .balance-card { background: linear-gradient(135deg, var(--bg3), var(--bg2)); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .balance-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; }
    .balance-amount { font-size: 28px; font-weight: bold; margin-bottom: 15px; }
    .balance-row { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 15px; }
    .stat-val { font-size: 15px; font-weight: 600; }
    .acc-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; scrollbar-width: none; }
    .acc-scroll::-webkit-scrollbar { display: none; }
    .acc-item { flex: 0 0 130px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 12px; }
    .acc-name { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .acc-bal { font-size: 13px; font-weight: bold; }
    .tx-row { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 15px; margin-bottom: 8px; }
    .tx-main { display: flex; justify-content: space-between; align-items: center; }
    .tx-cat { font-size: 14px; font-weight: 600; }
    .tx-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tx-meta { font-size: 10px; color: var(--gold); margin-top: 4px; display: flex; gap: 8px; }
    .tx-amt { font-weight: bold; font-size: 15px; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .field-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .field-input, .field-select { width: 100%; background: var(--bg2); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 15px; outline: none; }
    .form-btns { display: flex; gap: 10px; margin-top: 10px; }
    .btn-save { flex: 2; background: var(--gold); border: none; padding: 15px; border-radius: 10px; font-weight: bold; }
    .btn-cancel { flex: 1; background: var(--bg3); color: var(--muted); border: 1px solid var(--border); border-radius: 10px; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-top">
      <div class="app-title">Bookkeeper</div>
      <button class="btn-new" onclick="openAdd()">+ Entry</button>
    </div>
    <div class="nav">
      <button class="nav-btn active" id="nav-dashboard" onclick="setView('dashboard')">Summary</button>
      <button class="nav-btn" id="nav-history" onclick="setView('history')">Ledger</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<script>
const ACCOUNTS = ["PWN KBZ","PWN CB","PWN AYA","HMA AYA","MZ KBZ","MZ AYA","APP CB"];
const CATEGORIES = ["Income","Operation","Transport","Payment","Profit","Personal","Transfer","Bonus"];
let transactions = JSON.parse(localStorage.getItem('bk_tx') || '[]');
let nextId = parseInt(localStorage.getItem('bk_nid') || '1');
let currentView = 'dashboard';
function save() { localStorage.setItem('bk_tx', JSON.stringify(transactions)); localStorage.setItem('bk_nid', String(nextId)); }
function fmtAmt(n) { return new Intl.NumberFormat('en-US').format(Math.abs(n)) + ' MMK'; }
function setView(v) { currentView = v; document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === 'nav-'+v)); render(); }
function openAdd() { currentView = 'add'; render(); }
function render() {
  const c = document.getElementById('content');
  if (currentView === 'dashboard') c.innerHTML = renderDashboard();
  else if (currentView === 'history') c.innerHTML = renderHistory();
  else if (currentView === 'add') c.innerHTML = renderForm();
}
function renderDashboard() {
  const inc = transactions.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
  const exp = transactions.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);
  const bal = inc - exp;
  const accHtml = ACCOUNTS.map(acc => {
    const aInc = transactions.filter(t => t.account === acc && t.type === 'income').reduce((s,t) => s+t.amount, 0);
    const aExp = transactions.filter(t => t.account === acc && t.type === 'expense').reduce((s,t) => s+t.amount, 0);
    const aBal = aInc - aExp;
    return `<div class="acc-item"><div class="acc-name">${acc}</div><div class="acc-bal ${aBal>=0?'pos':'neg'}">${fmtAmt(aBal)}</div></div>`;
  }).join('');
  return `
    <div class="balance-card">
      <div class="balance-label">Total Balance</div>
      <div class="balance-amount ${bal>=0?'pos':'neg'}">${fmtAmt(bal)}</div>
      <div class="balance-row">
        <div><div class="balance-label">Income</div><div class="stat-val pos">+${fmtAmt(inc)}</div></div>
        <div><div class="balance-label">Expenses</div><div class="stat-val neg">-${fmtAmt(exp)}</div></div>
      </div>
    </div>
    <div class="section-label">Accounts</div>
    <div class="acc-scroll">${accHtml}</div>
    <div class="section-label">Recent Activity</div>
    ${transactions.slice(0,5).map(t => txRow(t)).join('') || '<div style="color:var(--muted)">No records yet</div>'}
  `;
}
function renderHistory() {
  return `<div class="section-label">Financial Ledger</div>` + (transactions.map(t => txRow(t)).join('') || '<div class="empty">Empty Ledger</div>');
}
function txRow(t) {
  return `
    <div class="tx-row">
      <div class="tx-main">
        <div>
          <div class="tx-cat">${t.category}</div>
          <div class="tx-desc">${t.note || 'No description'}</div>
          <div class="tx-meta"><span>${t.account}</span><span>${t.date}</span></div>
        </div>
        <div class="tx-amt ${t.type==='income'?'pos':'neg'}">
          ${t.type==='income'?'+':'-'}${fmtAmt(t.amount)}
        </div>
      </div>
    </div>`;
}
function renderForm() {
  return `
    <div class="section-label">New Transaction</div>
    <label class="field-label">Type</label>
    <select class="field-select" id="f-type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <label class="field-label">Amount (MMK)</label>
    <input class="field-input" type="number" id="f-amount" placeholder="0" inputmode="numeric">
    <label class="field-label">Account</label>
    <select class="field-select" id="f-account">${ACCOUNTS.map(a => `<option value="${a}">${a}</option>`).join('')}</select>
    <label class="field-label">Category</label>
    <select class="field-select" id="f-category">${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
    <label class="field-label">Description</label>
    <input class="field-input" type="text" id="f-note" placeholder="What was this for?">
    <div class="form-btns">
      <button class="btn-cancel" onclick="setView('dashboard')">Cancel</button>
      <button class="btn-save" onclick="addTx()">Save Entry</button>
    </div>
  `;
}
function addTx() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  if(!amount) return;
  transactions.unshift({
    id: nextId++,
    type: document.getElementById('f-type').value,
    amount,
    account: document.getElementById('f-account').value,
    category: document.getElementById('f-category').value,
    note: document.getElementById('f-note').value,
    date: new Date().toLocaleDateString()
  });
  save();
  setView('dashboard');
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
render();
</script>
</body>
</html>
